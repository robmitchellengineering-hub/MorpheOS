name: images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "crates/morph-boot/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "images/**"
      - "crates/morph-boot/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

jobs:
  x86-ab-fallback:
    name: "Try to Break It: A/B updates (x86 VM)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p morph-boot
      - name: Install image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap qemu-system-x86 ovmf \
            systemd-boot-efi dosfstools mtools fdisk e2fsprogs
      - name: Allow KVM if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Good, unhealthy and crashing updates
        run: sudo images/x86-qemu/test-fallback.sh "$RUNNER_TEMP/img" good unhealthy crash
      - name: Keep serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-serial-logs
          path: ${{ runner.temp }}/img/serial-*.log
          retention-days: 7

  pi5-image:
    name: Raspberry Pi 5 self-test image
    # Native ARM64: the Pi's own architecture, so neither morph-boot nor the image
    # build runs under emulation. Free for public repositories; GitHub refuses to
    # start this runner in a private one, so this job needs the repo to be public.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      # Pinned for reproducible builds; bump deliberately.
      RPI_IMAGE_GEN_REF: b7077549890ed8a3854ebb136e9458e5b1658391
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build morph-boot (native aarch64)
        run: cargo build --release -p morph-boot
      - name: Fetch rpi-image-gen (pinned)
        run: |
          git init "$RUNNER_TEMP/rpi-image-gen"
          cd "$RUNNER_TEMP/rpi-image-gen"
          git remote add origin https://github.com/raspberrypi/rpi-image-gen.git
          git fetch --depth 1 origin "$RPI_IMAGE_GEN_REF"
          git checkout FETCH_HEAD
      - name: Install rpi-image-gen dependencies (native arm64)
        run: |
          sudo apt-get update
          sudo chmod o+x /home/runner
          cd "$RUNNER_TEMP/rpi-image-gen" && sudo ./install_deps.sh
      - name: Build image
        run: |
          set -euo pipefail
          images/pi5/build.sh "$RUNNER_TEMP/rpi-image-gen" \
            target/release/morph-boot "$RUNNER_TEMP/pi5" | tee "$RUNNER_TEMP/build.log"
          IMG=$(tail -1 "$RUNNER_TEMP/build.log")
          test -f "$IMG"
          mkdir -p "$RUNNER_TEMP/out"
          zstd -T0 -10 "$IMG" -o "$RUNNER_TEMP/out/morpheos-pi5-selftest.img.zst"
          sha256sum "$RUNNER_TEMP/out/morpheos-pi5-selftest.img.zst" | tee "$RUNNER_TEMP/out/SHA256SUMS"
          ls -la "$RUNNER_TEMP/out"
      - name: Verify the built image against the A/B contract
        run: |
          set -euo pipefail
          IMG=$(tail -1 "$RUNNER_TEMP/build.log")
          test -f "$IMG"
          # The tools the x86 test already uses to read a disk image, plus
          # erofs-utils: the slot rootfs is EROFS, and a CI kernel is not guaranteed
          # to have the erofs driver — reading it in userspace is what distinguishes
          # "the image is empty" from "this kernel cannot read it".
          sudo apt-get install -y --no-install-recommends dosfstools mtools fdisk e2fsprogs erofs-utils
          # Facts first, always printed and always uploaded: if a check fails, the
          # log still has to show what the image ACTUALLY contains, or the next
          # attempt is another 17-minute guess.
          sudo images/pi5/image-facts.sh "$IMG" crates/morph-boot/src/pi.rs \
            | tee "$RUNNER_TEMP/out/image-facts.txt"
          echo "──────────────────────────────────────────────────────────────"
          node scripts/verify-pi-image.mjs "$RUNNER_TEMP/out/image-facts.txt"
          # And the verifier's own negative test, because a check nobody has seen
          # fail is a check that might not work. It costs nothing here.
          echo "──────────────────────────────────────────────────────────────"
          node scripts/verify-pi-image.mjs --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morpheos-pi5-selftest
          path: ${{ runner.temp }}/out/
          retention-days: 7
