name: images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "crates/morph-boot/**"
      - "crates/strata/**"
      - ".github/workflows/images.yml"
  # ⚠️ NO `paths:` FILTER ON pull_request, AND THAT IS THE POINT.
  #
  # These two jobs are REQUIRED checks on `main`. A required check that a path filter
  # can skip **never runs**, so the pull request waits for it forever and can never be
  # merged — the check becomes a wall rather than a gate. So either the filter goes or
  # the requirement does; the filter went.
  #
  # Why this was needed at all: `main` sat RED on this workflow for hours, through
  # three merges, because the jobs were filtered AND optional. Nothing required them,
  # so nothing noticed. Found on 2026-10-11 only by comparing every workflow's latest
  # run against its triggers — not by any failing gate, because there was no gate.
  #
  # The cost, stated plainly: every pull request now runs a ~17-minute Raspberry Pi
  # image build, including documentation-only ones. It costs no money — this
  # repository is public, so standard runners are free — and Rob chose correctness
  # over PR latency on 2026-10-11. If the latency becomes the problem, the alternative
  # is a nightly run against `main` instead, which trades it back for up to a day of
  # unnoticed breakage.
  pull_request:
  workflow_dispatch:

jobs:
  x86-ab-fallback:
    # The name is a required check (AGENTS.md H10): renaming it needs the branch
    # protection changed in the same step, so it stays as it was although the job now
    # also runs the ransomware scenario.
    name: "Try to Break It: A/B updates (x86 VM)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p morph-boot -p strata
      # The update scenario needs the updater. Built here, as a sibling of the line
      # above and for the same reason: the harness scripts run under `sudo`, whose PATH
      # has no cargo, so a binary built inside them cannot find its own toolchain.
      - run: cargo build --release -p morph-update
      - run: cargo build --release -p morph-heal
      # The SAME script the builder runs in WSL2 (doc 20, S10), with the image and VM tools,
      # and KVM opened up if the runner has it.
      - name: Install image and VM tools (scripts/setup-linux.sh --images)
        run: bash scripts/setup-linux.sh --images
      # ⚠️ FIRST, AND BEFORE THE SCENARIOS. This is the image a PERSON boots — the one that
      # goes on real hardware — and it is built and published before any test that might fail,
      # so a red scenario cannot cost us the artefact somebody is waiting for. `if: always()`
      # on the upload keeps that true even if a later step goes red.
      - name: Build the image a person can use
        run: |
          sudo images/x86-qemu/build.sh "$RUNNER_TEMP/img" plain
          # `build.sh` runs as root, so the work directory is root-owned and the next step —
          # which runs as the runner user — cannot create the compressed copy beside it.
          # (`xz: ...: Permission denied`, which cost a run.)
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/img"
      - name: Boot the image a person can use
        run: sudo images/x86-qemu/test-boot.sh "$RUNNER_TEMP/img" 150
      # The image a person logs into must not print the Ubuntu legal notice twice. The
      # `noupdate` motd line was removed at build time (images/x86-qemu/build.sh); this is
      # the behavioural half of the guard — the serial log shows the notice printing twice
      # (`welcome=1 legal=2`) if the line comes back. It runs against the plain image's boot,
      # before the ~17-minute scenarios, so the regression fails fast. The verifier's own
      # negative test runs in the `ci` workflow, where it costs a second.
      - name: Prove the legal notice is not doubled
        run: node scripts/verify-motd.mjs "$RUNNER_TEMP/img/serial-plain.log"
      # The raw disk is ~4.5 GiB of mostly empty ext4; `xz` makes it a download rather than a
      # transfer. Level 3 with threads: this is a convenience, not an archive.
      #
      # `if: always()` — the first version ran this after the boot check without it, so a FAILED
      # check published nothing: a red test cost exactly the artifact the test exists to protect.
      # The raw disk is then dropped, because the scenarios that follow need the room.
      - name: Compress the hardware image, and drop the raw one
        if: always()
        run: |
          xz -T0 -3 -k -f "$RUNNER_TEMP/img/disk-plain.img"
          rm -f "$RUNNER_TEMP/img/disk-plain.img" "$RUNNER_TEMP/img/disk-plain.vars.fd"
      - name: Keep the hardware image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morpheos-x86-usb
          path: ${{ runner.temp }}/img/disk-plain.img.xz
          if-no-files-found: ignore
          retention-days: 30
      # Both sides of this step existed and both are real: this branch adds the Strata
      # ransomware test, and `main` grew the `heal` scenario. Kept both — a merge that
      # drops one of them is the quiet way to lose a test.
      - name: Good, unhealthy, crashing, updating and healing
        run: sudo images/x86-qemu/test-fallback.sh "$RUNNER_TEMP/img" good unhealthy crash update heal
      - name: Ransomware against Strata
        run: sudo images/x86-qemu/test-ransomware.sh "$RUNNER_TEMP/img"
      # Doc 20, E3 and E10: the compositor drives a real (virtio-gpu) display and the VM's
      # own keyboard and mouse, and every verdict is a screenshot's pixels. Its system
      # libraries came from setup-linux.sh above.
      - name: The Flow shell on a real display, with a keyboard and a mouse
        run: |
          cargo build --release -p flow-compositor
          sudo images/x86-qemu/test-shell.sh "$RUNNER_TEMP/img"
      # Doc 20, E4: Firefox (Mozilla's own build, from packages.mozilla.org) on the shell,
      # showing a local page; the verdict is the page's colours in a screendump.
      - name: A browser on the Flow shell
        run: sudo images/x86-qemu/test-browser.sh "$RUNNER_TEMP/img"
      - name: Keep serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-serial-logs
          path: |
            ${{ runner.temp }}/img/serial-*.log
            ${{ runner.temp }}/img/screen-*.ppm
            ${{ runner.temp }}/img/screen-browser*.ppm
          retention-days: 7

  pi5-image:
    name: Raspberry Pi 5 self-test image
    # Native ARM64: the Pi's own architecture, so neither morph-boot nor the image
    # build runs under emulation. Free for public repositories; GitHub refuses to
    # start this runner in a private one, so this job needs the repo to be public.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      # Pinned for reproducible builds; bump deliberately.
      RPI_IMAGE_GEN_REF: b7077549890ed8a3854ebb136e9458e5b1658391
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build morph-boot (native aarch64)
        run: cargo build --release -p morph-boot
      - name: Fetch rpi-image-gen (pinned)
        run: |
          git init "$RUNNER_TEMP/rpi-image-gen"
          cd "$RUNNER_TEMP/rpi-image-gen"
          git remote add origin https://github.com/raspberrypi/rpi-image-gen.git
          git fetch --depth 1 origin "$RPI_IMAGE_GEN_REF"
          git checkout FETCH_HEAD
      - name: Install rpi-image-gen dependencies (native arm64)
        run: |
          sudo apt-get update
          sudo chmod o+x /home/runner
          cd "$RUNNER_TEMP/rpi-image-gen" && sudo ./install_deps.sh
      - name: Build image
        run: |
          set -euo pipefail
          images/pi5/build.sh "$RUNNER_TEMP/rpi-image-gen" \
            target/release/morph-boot "$RUNNER_TEMP/pi5" | tee "$RUNNER_TEMP/build.log"
          IMG=$(tail -1 "$RUNNER_TEMP/build.log")
          test -f "$IMG"
          mkdir -p "$RUNNER_TEMP/out"
          zstd -T0 -10 "$IMG" -o "$RUNNER_TEMP/out/morpheos-pi5-selftest.img.zst"
          sha256sum "$RUNNER_TEMP/out/morpheos-pi5-selftest.img.zst" | tee "$RUNNER_TEMP/out/SHA256SUMS"
          ls -la "$RUNNER_TEMP/out"
      - name: Verify the built image against the A/B contract
        run: |
          set -euo pipefail
          IMG=$(tail -1 "$RUNNER_TEMP/build.log")
          test -f "$IMG"
          # The tools the x86 test already uses to read a disk image, plus
          # erofs-utils: the slot rootfs is EROFS, and a CI kernel is not guaranteed
          # to have the erofs driver — reading it in userspace is what distinguishes
          # "the image is empty" from "this kernel cannot read it".
          sudo apt-get install -y --no-install-recommends dosfstools mtools fdisk e2fsprogs erofs-utils
          # Facts first, always printed and always uploaded: if a check fails, the
          # log still has to show what the image ACTUALLY contains, or the next
          # attempt is another 17-minute guess.
          sudo images/pi5/image-facts.sh "$IMG" crates/morph-boot/src/pi.rs \
            | tee "$RUNNER_TEMP/out/image-facts.txt"
          echo "──────────────────────────────────────────────────────────────"
          node scripts/verify-pi-image.mjs "$RUNNER_TEMP/out/image-facts.txt"
          # And the verifier's own negative test, because a check nobody has seen
          # fail is a check that might not work. It costs nothing here.
          echo "──────────────────────────────────────────────────────────────"
          node scripts/verify-pi-image.mjs --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morpheos-pi5-selftest
          path: ${{ runner.temp }}/out/
          retention-days: 7
