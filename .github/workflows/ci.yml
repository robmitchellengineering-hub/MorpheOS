name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # flow-compositor (Smithay) links libxkbcommon and pixman, and its keyboard reads the
      # keymap from xkb-data. Both are small, and the
      # crate's dependency on them is Linux-only, so a Mac build needs neither.
      - name: Install the compositor's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev xkb-data libinput-dev libseat-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Validate example manifests
        run: |
          for f in manifest/examples/*.toml; do
            cargo run -q -p morph-manifest -- validate "$f"
          done
      # THE FRAME CHECK (ADR 0010: "CI proves a frame, not a unit"). The shell's frame is
      # the first thing in this repository meant to be LOOKED AT rather than read, and it is
      # not evidence because a test says it has colours. So the binary
      # renders a real frame and FAILS THE BUILD when that frame has no content, and the
      # frame is uploaded so it can be opened. Without this step the pass would only run
      # when somebody remembered to run it, which is the failure mode this repository is
      # written against.
      #
      # The binary writes the PNG itself rather than the workflow shelling out to an image
      # tool: `convert` is NOT installed on ubuntu-latest (`command not found`, run
      # 38147143859), and a PPM cannot be opened in a browser. One less assumption about
      # the runner, and the frame is viewable on any machine that can run the binary.
      - name: Render the shell's frame, and prove it is not blank
        run: cargo run -q -p flow-shell -- --out frame.png --sessions 3
      - name: Keep the frame, so it can actually be looked at
        uses: actions/upload-artifact@v4
        with:
          name: flow-shell-frame
          path: frame.png
          if-no-files-found: error
      # THE COMPOSITOR'S FRAME (HANDOFF.md E1). `cargo test` already asserts the pixels; this
      # keeps one frame with a real client's window in it, so it can be looked at.
      - name: Render a real client's window through the compositor
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          cargo build -q -p flow-compositor
          target/debug/flow-compositor --socket ci --out compositor-frame.png --timeout 30 &
          until [ -S "$XDG_RUNTIME_DIR/ci" ]; do sleep 0.1; done
          WAYLAND_DISPLAY=ci target/debug/solid-window --colour 00a0ff --size 320x200 || true
          wait %1
      - name: Keep the compositor's frame
        uses: actions/upload-artifact@v4
        with:
          name: flow-compositor-frame
          path: compositor-frame.png
          if-no-files-found: error
      # The docs ARE the deliverable so far, and nothing was checking that they still
      # point at things that exist: a renamed doc, an unlisted ADR, a crate the README
      # does not name. None of those break a build, which is exactly why they rot.
      # Dependency-free, so it needs no install step.
      - name: Verify the documentation against the repository
        run: node scripts/verify-docs.mjs
      # THE PLAN IS THE ONLY TASK LIST (docs/20-build-plan.md), and this keeps it honest: every
      # task has a check, "done" has evidence, and a pull request's branch names the task it
      # serves. It is how the work stays on the plan after the handover.
      - name: Verify the build plan, and that this branch serves a task in it
        run: |
          node scripts/verify-plan.mjs --self-test
          if [ -n "$GITHUB_HEAD_REF" ]; then
            # Judge the branch against the plan it started from (see the script's header).
            git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
            git show "origin/$GITHUB_BASE_REF:docs/20-build-plan.md" > "$RUNNER_TEMP/base-plan.md"
            node scripts/verify-plan.mjs --branch "$GITHUB_HEAD_REF" --base "$RUNNER_TEMP/base-plan.md"
          else
            node scripts/verify-plan.mjs
          fi
      # A CONSOLE FONT CANNOT DRAW EVERYTHING, AND A LOG CANNOT SHOW YOU THAT. A screenshot
      # of the booted image showed `MorpheOS ■ "never breaks, and heals itself"` on a real
      # screen, while the serial log had carried the same bytes and read as text. This is
      # the guard that replaces the next screenshot: it checks the files the machine prints
      # whole, and the printing LINES of the scripts it runs, and it proves it can fail -
      # including the false-positive control, because a guard that flags prose gets ignored.
      - name: Prove the console can draw what the machine prints on it
        run: |
          node scripts/verify-console-text.mjs --self-test
          node scripts/verify-console-text.mjs
      # The Pi image verifier's own negative test. Reading a real image needs root
      # and losetup and a 17-minute build, but its ASSERTIONS are plain logic over a
      # facts file — so they run here in a second, against a good fixture and twelve
      # sabotages. Without this, a verifier that stopped biting would only be
      # discovered by the one job that is too slow to run on every pull request.
      - name: Prove the Pi image verifier can fail
        run: node scripts/verify-pi-image.mjs --self-test
      # The motd verifier's own negative test. The behavioural check runs against the x86
      # serial log in the `images` workflow (too slow for every PR); its ASSERTIONS are plain
      # counting over a log, so they run here in a second against the doubled-notice fixture
      # and the fixed one. Without this, a verifier that stopped biting would only be found
      # by the one job that boots an image.
      - name: Prove the motd verifier can fail
        run: node scripts/verify-motd.mjs --self-test
      # `apply` is the one command whose exit code IS the contract (0 applied, 1 REFUSED,
      # 2 a defect), and `cargo test` calls `apply()` directly — so nothing above covers the
      # argument handling, or the mapping from a refusal to exit 1. Each case here asserts
      # the code AND the effect on the file, because "exit 1 with the target rewritten" is
      # the failure that matters and it is invisible to an exit code alone.
      - name: Prove `apply` refuses what it must, and writes nothing when it does
        run: bash scripts/verify-apply-cli.sh
      # The transaction's contract is wider than an exit code: a check that fails or never
      # finishes must leave the machine on the generation it was on before, and committed is
      # the only state that keeps a trial. `cargo test` calls the library directly, so the
      # ordering a caller imposes — recover, arm, apply, check, commit or roll back — is
      # covered only here.
      - name: Prove a transaction takes itself back
        run: bash scripts/verify-transaction-cli.sh
