name: diag
on: [push, workflow_dispatch]
jobs:
  motd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: morpheos-x86-usb
          run-id: 38134288120
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: mount the published image and read what prints the login banner
        run: |
          xz -dc disk-plain.img.xz > disk.img
          LOOP=$(sudo losetup -Pf --show disk.img)
          sudo partprobe "$LOOP" || true
          sleep 2
          echo "=== partitions ==="
          sudo blkid | sed -n '1,12p'
          for part in ${LOOP}p1 ${LOOP}p2 ${LOOP}p3 ${LOOP}p4; do
            [ -b "$part" ] || continue
            sudo mount -o ro "$part" /mnt/root 2>/dev/null || continue
            if [ -d /mnt/root/etc ]; then
              echo "=== root filesystem is $part ==="
              echo "=== /etc/motd: $(sudo ls -l /mnt/root/etc/motd 2>/dev/null || echo 'absent') ==="
              sudo cat /mnt/root/etc/motd 2>/dev/null || true
              echo "=== /etc/update-motd.d/ ==="
              sudo ls -la /mnt/root/etc/update-motd.d/ 2>/dev/null || echo "(no such directory)"
              for f in $(sudo ls /mnt/root/etc/update-motd.d/ 2>/dev/null); do
                echo "--- /etc/update-motd.d/$f"
                sudo cat "/mnt/root/etc/update-motd.d/$f"
              done
              echo "=== /etc/motd.d/ ==="
              sudo ls -la /mnt/root/etc/motd.d/ 2>/dev/null || echo "(no such directory)"
              echo "=== pam_motd lines ==="
              sudo grep -rn pam_motd /mnt/root/etc/pam.d/ 2>/dev/null || echo "(none)"
              echo "=== /usr/sbin/update-motd ==="
              sudo cat /mnt/root/usr/sbin/update-motd 2>/dev/null || echo "(absent)"
              sudo umount /mnt/root
              break
            fi
            sudo umount /mnt/root 2>/dev/null || true
          done
