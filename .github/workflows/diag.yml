name: diag
on: [push, workflow_dispatch]
jobs:
  motd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: morpheos-x86-usb
          run-id: 38134288120
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: who references /etc/legal
        run: |
          xz -dc disk-plain.img.xz > disk.img
          LOOP=$(sudo losetup -Pf --show disk.img)
          sudo partprobe "$LOOP" || true
          sleep 2
          sudo mkdir -p /mnt/root
          sudo mount -o ro "/dev/$(lsblk -ln -o NAME,LABEL "$LOOP" | awk '$2=="root-a"{print $1}')" /mnt/root
          echo "=== every reference to legal in /etc ==="
          sudo grep -rn "legal" /mnt/root/etc/ 2>/dev/null | head -20
          echo "=== /etc/pam.d/login, in full ==="
          sudo cat /mnt/root/etc/pam.d/login
          echo "=== anything that cats /etc/legal anywhere ==="
          sudo grep -rln "/etc/legal" /mnt/root/etc /mnt/root/usr/lib /mnt/root/usr/share 2>/dev/null | head -20
