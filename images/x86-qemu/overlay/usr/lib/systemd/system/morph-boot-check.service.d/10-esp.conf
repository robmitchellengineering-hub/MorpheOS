[Unit]
# loader.conf (the default slot) and the self-test state live on the ESP.
RequiresMountsFor=/efi

[Service]
Environment=MORPH_TEST_DIR=/efi/morph-test MORPH_TEST_FINISH=poweroff
# The result, on the FAT partition a person can read by pulling the disk out. The harness
# asserts it exists and is not baked into the image, so it proves the machine wrote it.
Environment=MORPH_TEST_REPORT=/efi/MORPH-TEST-RESULT.TXT
# The root is read-only; boot history goes where it survives reboots.
Environment=MORPH_BOOT_HISTORY=/efi/morph-boot/history.jsonl
