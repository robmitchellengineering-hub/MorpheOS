# ⚠️ WHERE THE RESOLVER IS WRITTEN. NetworkManager writes the nameservers it learns from DHCP
# into /etc/resolv.conf, and /etc is on the read-only root: the write fails, the join still
# reports success, and the machine then resolves nothing. That is the shape of the first
# real-hardware boot's report (MacBookPro9,1, 2026-10-28): "the wifi is connected but firefox
# isnt loading anything", with no route or nameserver ever written.
#
# So /etc/resolv.conf in this image is a symlink to /run/NetworkManager/resolv.conf (made in
# images/x86-qemu/build.sh) and NetworkManager is told to keep writing there. `dns=default`
# stops it handing the job to systemd-resolved, which this image does not run.
[main]
dns=default
rc-manager=symlink
