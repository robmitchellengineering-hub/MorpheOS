# ⚠️ WHERE A JOINED NETWORK IS SAVED. NetworkManager writes each connection it adds (a Wi-Fi
# network and its password) as a keyfile in /etc/NetworkManager/system-connections, which is
# on the read-only root: every join was refused ("settings plugin does not support adding
# connections"). Found by test-wifi.sh. Saved networks belong with the person's data, on the
# data partition, so they outlive a reboot and an update (the directory is made at boot by
# tmpfiles.d/morpheos-network.conf, mode 0700: keyfiles hold Wi-Fi passwords).
[keyfile]
path=/persist/network/system-connections
