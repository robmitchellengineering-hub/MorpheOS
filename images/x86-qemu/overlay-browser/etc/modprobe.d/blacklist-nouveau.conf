# The reference laptop (MacBookPro9,1) has hybrid Intel + NVIDIA graphics. On Linux the
# open-source nouveau driver for the NVIDIA chip renders garbage for WebGL (the launch
# animation flashes nonsense), while the Intel i915 driver is mature and drives the panel
# exactly as macOS uses the Intel GPU. Blacklist nouveau so Firefox renders on i915 — this
# changes only WHICH GPU draws, never how the animation renders.
blacklist nouveau
