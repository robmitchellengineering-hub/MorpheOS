# Take the key from a command, so no file mode, owner or home directory can refuse it (see keys-for).
# Both mechanisms stay live: the file is still tried, and this path covers the cases where the file is
# unusable. sshd requires AuthorizedKeysCommandUser to be set alongside it.
AuthorizedKeysCommand /usr/lib/morpheos/keys-for %u
AuthorizedKeysCommandUser root
