# MorpheOS runs its desktop session as ROOT (autologin on tty2), and the distribution's audio units carry
# ConditionUser=!root - so systemd skipped PipeWire, wireplumber and pipewire-pulse at every boot, and no
# application could make a sound. Measured on the reference laptop 2026-11-04: "ConditionUser=!root was not
# met", no sinks, Firefox silent on a machine whose CS4206 analog codec had been bound correctly all along.
#
# Clearing the condition is the smallest change that makes audio exist. The bigger fix is a non-root session,
# which is a change to how MorpheOS logs in, not to the audio stack - recorded as a plan rather than smuggled
# in here.
[Unit]
ConditionUser=
