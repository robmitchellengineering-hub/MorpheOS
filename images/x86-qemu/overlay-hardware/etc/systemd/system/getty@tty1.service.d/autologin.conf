# An image for a person to use, not a harness to run.
#
# The laptop this goes on has no working screen, so there is no way to type a password into a
# login prompt that is not visible until an external display is attached — and a test image
# whose first step is "find a keyboard" is a test nobody runs. Root, no password, on the local
# console only: `serial-getty@ttyS0` is autologged in for the same reason, and nothing is
# exposed over a network, because this image has none configured.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
