# MorpheOS: put the boot history on storage that survives a reboot.
#
# WHY. boot-check's own default is /var/lib/morph-boot/history.jsonl, and on this image /var is a tmpfs on a
# read-only root - so the default writes the record of every boot into space that empties. The design intent is
# stated in boot-check itself: "one JSON line per boot that reached this check, on storage that survives
# reboots". /efi is the ESP, which is exactly that, and it is where the update tests and morph-heal look.
#
# Measured 2026-11-04: the reference laptop writes /efi/morph-boot/history.jsonl on every boot, while the CI
# boot test found no /morph-boot on the ESP at all - the path was arriving from whichever overlay happened to
# set it. Setting it here makes it the image's own decision instead of an accident of layering.
[Service]
Environment=MORPH_BOOT_HISTORY=/efi/morph-boot/history.jsonl
