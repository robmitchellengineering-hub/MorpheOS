# MorpheOS: keep the node's tailnet identity on the data partition.
#
# WHY. The stock tailscaled unit writes its state to /var/lib/tailscale, and on this image the root is
# read-only: /var is a tmpfs that is empty at every boot. A node whose identity is in /var re-registers (or
# fails to) after every reboot, which is not a node.
#
# /persist is the data partition: writable, and the one place that survives a reboot. The state, the socket and
# the directory are all created before the daemon starts, because the unit runs before anything else has.
[Unit]
# NOT RequiresMountsFor=/persist/tailscale. That path does not exist on a fresh boot - ExecStartPre is what
# creates it - and a mount requirement on a missing path fails the unit before anything runs. Measured
# 2026-11-04: the boot screen showed a red failure line and the image's own boot test went red because of it.
After=persist.mount

[Service]
# THE FAILURE THIS FILE ALREADY CAUSED ONCE. The stock unit declares CacheDirectory=tailscale, so systemd
# creates /var/cache/tailscale BEFORE any ExecStartPre runs - on a read-only root that fails the unit with
# status 239/CACHE_DIRECTORY and it never starts, no matter how correct the ExecStart is. Cleared here.
CacheDirectory=
CacheDirectoryMode=
StateDirectory=
ExecStartPre=/bin/mkdir -p /persist/tailscale /run/tailscale
ExecStartPre=/bin/chmod 0700 /persist/tailscale
# Cleared first, then set: a drop-in that only adds a line would leave the stock ExecStart running too, and the
# daemon would come up with its state in /var anyway — which is the bug this file exists to prevent.
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/persist/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=41641
