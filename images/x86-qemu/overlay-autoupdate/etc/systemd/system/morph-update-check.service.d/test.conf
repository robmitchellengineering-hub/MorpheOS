[Service]
# The CI host's update server, seen by the VM as 10.0.2.2 over QEMU's user network (doc 20,
# S3 note 4). Overrides the placeholder in the unit; never present in the real unit.
Environment=MORPH_UPDATE_BASE=https://10.0.2.2:8123
# The throwaway CA test-autoupdate.sh baked into this image. Never in the real unit.
Environment=MORPH_UPDATE_CA=/usr/share/morpheos/update-test-ca.pem
# The test reboots right after arming (doc 20, S3 note 6); production waits for the next boot
# a person makes.
Environment=MORPH_UPDATE_REBOOT=now
