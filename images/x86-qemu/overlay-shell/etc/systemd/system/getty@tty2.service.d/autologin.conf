# The root console, on VT2 while the shell has VT1 (Ctrl+Alt+F2). Autologged in for the same
# reason as the hardware image's tty1 (see overlay-hardware's getty@tty1 note): this is a
# test image, and the console is the way in when the shell is not enough.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
