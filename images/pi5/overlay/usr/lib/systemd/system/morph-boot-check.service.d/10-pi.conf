[Unit]
# autoboot.txt lives on the writable boot-select partition; test state on /persistent.
RequiresMountsFor=/bootfs /persistent

[Service]
Environment=MORPH_TEST_DIR=/persistent/morph-test MORPH_TEST_EXPECT=b MORPH_TEST_FINISH=stay
# The root is read-only; boot history goes where it survives reboots.
Environment=MORPH_BOOT_HISTORY=/persistent/morph-boot/history.jsonl
