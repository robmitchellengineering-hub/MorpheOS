<!doctype html>
<!-- The page Firefox opens on in `plain` (doc 20, E4). Local, so it works with no network
     and tells nobody the machine booted. Its background is a colour nothing else on the
     screen uses: test-boot.sh finds Firefox by it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MorpheOS</title>
<style>
  html, body { margin: 0; height: 100%; background: #5a3cb4; color: #f0f0f8;
               font-family: "DejaVu Sans", sans-serif; }
  main { padding: 48px; }
  h1 { font-size: 40px; margin: 0 0 24px; }
  p { font-size: 18px; margin: 8px 0; }
</style>
</head>
<body><main>
<h1>MorpheOS</h1>
<p>Type an address above to browse.</p>
<p>Alt+Tab switches windows. Super+F makes one fullscreen. Drag a window by its edge to move it.</p>
<p>Ctrl+Alt+F2 opens the console; Ctrl+Alt+F1 comes back.</p>
</main></body>
</html>
