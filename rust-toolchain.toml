# The toolchain CI and a contributor share.
#
# WHY THIS EXISTS: `.github/workflows/ci.yml` uses `dtolnay/rust-toolchain@stable`
# with the rustfmt and clippy components, while nothing in the repo said so — so a
# contributor with a distro `rustc`, or without clippy, discovered the difference
# only when CI rejected them. This file makes the channel and the components part
# of the repo, so `cargo fmt --check`, `cargo clippy -- -D warnings` and
# `cargo test --all` mean the same thing locally and in CI.
#
# ⚠️ KNOWN LIMIT, stated rather than papered over: `dtolnay/rust-toolchain@stable`
# in the workflow OVERRIDES this file's channel, so this pins the components and
# documents the channel but does not yet pin an exact version. Pinning one (and
# having the workflow honour it by dropping `@stable`) is the right next step and
# is deliberately not smuggled into this change — it needs a CI run to prove it.
#
# Edition 2024 (workspace `Cargo.toml`) requires Rust 1.85 or newer.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
