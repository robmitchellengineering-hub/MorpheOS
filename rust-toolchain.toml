# The toolchain CI and a contributor share: one exact version (doc 20, S9).
#
# WHY EXACT. `stable` meant "whatever was newest when each machine last updated", and CI
# updated every run: on 2026-10-13 CI's newer clippy rejected code that had passed
# `scripts/check.sh` on the builder's machine (`clippy::chunks_exact_to_as_chunks`), so the
# local bar was not CI's bar. Now both install exactly this version, through
# `scripts/rust-toolchain.sh`, which fails if the `rustc` in use is any other.
#
# BUMPING IT is a pull request of its own: change the version here, run `scripts/check.sh`,
# fix what the new compiler and clippy say, and let CI prove it. Never in passing.
#
# Edition 2024 (workspace `Cargo.toml`) requires Rust 1.85 or newer; the code uses
# let-chains and `as_chunks` (1.88).
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
