<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MorpheOS — the Geomesh</title>
<!-- Boot splash (E19): hand over to the browser start page once the draw has settled. A
     browser-native refresh, so it fires even if WebGL is unavailable and the mesh never renders. -->
<style>
  :root { --green:#00ff41; }
  * { margin:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#05070d; overflow:hidden;
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage { position:absolute; inset:0; }
  #stage canvas { display:block; }
  .vignette {
    position:absolute; inset:0; pointer-events:none; z-index:2;
    background: radial-gradient(ellipse 72% 62% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.62) 100%);
  }
  .fade {
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:10;
  }

  .word {
    position:absolute; left:0; right:0; bottom:15%; text-align:center;
    font-weight:700; font-size:clamp(44px, 8.5vw, 104px);
    letter-spacing:0.04em; line-height:1;
    perspective:700px;
    opacity:0; animation: rise 1.8s cubic-bezier(0.16,1,0.3,1) 1.1s forwards; animation-play-state: paused;
    pointer-events:none;
  }
  .word .inner {
    display:inline-block;
    transform:rotateX(8deg);
    filter: drop-shadow(0 14px 26px rgba(0,0,0,0.65)) drop-shadow(0 0 26px rgba(0,255,65,0.28));
  }
  .word .m {
    background: linear-gradient(100deg,
      #7CFFBE 0%, #00ff41 22%, #2BDE7C 38%, #9dffcd 50%,
      #0B5A2E 66%, #00ff41 82%, #7CFFBE 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: shine 4.5s ease-in-out infinite;
  }
  .word .o {
    background: linear-gradient(180deg, #ffffff 0%, #c9ded2 55%, #9fb8a8 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  @keyframes shine { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
  @keyframes rise { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
  body.go .word, body.go .tag { animation-play-state: running; }
  body.still .word, body.still .tag { opacity: 1; animation: none; }

  .tag {
    position:absolute; left:0; right:0; bottom:8%; text-align:center;
    color:#5f8f72; font-size:11px; letter-spacing:0.5em; text-indent:0.5em; text-transform:uppercase;
    opacity:0; animation: rise 1.8s cubic-bezier(0.16,1,0.3,1) 1.5s forwards; animation-play-state: paused;
    pointer-events:none;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div class="word"><span class="inner"><span class="m">Morphe</span><span class="o">OS</span></span></div>
  <div class="tag">Never breaks · Heals itself</div>
  <div class="fade" id="fade"></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/Pass.js"></script>
  <script src="vendor/CopyShader.js"></script>
  <script src="vendor/LuminosityHighPassShader.js"></script>
  <script src="vendor/MaskPass.js"></script>
  <script src="vendor/ShaderPass.js"></script>
  <script src="vendor/RenderPass.js"></script>
  <script src="vendor/EffectComposer.js"></script>
  <script src="vendor/UnrealBloomPass.js"></script>

  <script>
  'use strict';
  (function () {
    const GEOMESH_R = 2.4;
    const fadeEl = document.getElementById('fade');
    const STILL = new URLSearchParams(location.search).get('t');
    if (STILL != null) document.body.classList.add('still');
    const STOPS = [
      { t: 0.00, c: 0x4d6bfe },  // DeepSeek blue
      { t: 0.22, c: 0x06b6d4 },  // cyan
      { t: 0.44, c: 0xff2fd6 },  // neon pink
      { t: 0.66, c: 0xa78bfa },  // purple
      { t: 0.86, c: 0x00ff41 },  // matrix green — lands here
      { t: 1.00, c: 0x00ff41 },
    ];
    const stopColors = STOPS.map((s) => new THREE.Color(s.c).convertSRGBToLinear());

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('stage').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070d);
    scene.fog = new THREE.FogExp2(0x05070d, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 0.5, 10);
    camera.lookAt(0, 0, 0);

    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.42, 0.56);
    composer.addPass(bloomPass);

    function glowTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(0.25, 'rgba(255,255,255,0.55)');
      gr.addColorStop(0.6, 'rgba(255,255,255,0.12)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    const glow = glowTexture();

    // faint centre glow for depth (no nebula — just the geomesh in space)
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glow, color: 0x00ff41, transparent: true, opacity: 0.10,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    halo.scale.setScalar(7.5);
    scene.add(halo);

    // the green settle ripple that fires the moment the mesh finishes drawing
    const settleFlash = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glow, color: 0x00ff41, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    settleFlash.scale.setScalar(0.6);
    settleFlash.visible = false;
    scene.add(settleFlash);

    // ---- the geomesh: wireframe that draws itself, turning left, phasing to green ----
    const geomeshGeom = new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(GEOMESH_R, 1));
    const totalEdges = geomeshGeom.attributes.position.count;
    const geomeshMat = new THREE.LineBasicMaterial({ color: stopColors[0].clone(), toneMapped: false });
    const geomesh = new THREE.LineSegments(geomeshGeom, geomeshMat);
    scene.add(geomesh);
    const numEdges = totalEdges / 2;

    // the hot blue tip of the line as it draws — big enough to see
    const tipCore = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glow, color: 0xeaf6ff, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    tipCore.scale.setScalar(0.22);
    geomesh.add(tipCore);
    const tipHalo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glow, color: 0x4d9bff, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    tipHalo.scale.setScalar(0.62);
    geomesh.add(tipHalo);

    // ---- the two data rings, built as CABLE tubes (flow + travelling bulge + swell) ----
    const TUBE_SEGS = 240, TUBE_RADIAL = 12;
    const HOSE_SWELL = 2.4, HOSE_TIGHT = 260;
    const _up = new THREE.Vector3(0, 0, 1);
    const _tan = new THREE.Vector3(), _nrm = new THREE.Vector3(), _bin = new THREE.Vector3();
    const _ax = new THREE.Vector3();

    function makeCableRing(R, tubeR, hex, spin, precess, speed) {
      const geom = new THREE.BufferGeometry();
      const verts = (TUBE_SEGS + 1) * TUBE_RADIAL;
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
      geom.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(verts * 2), 2));
      const idx = [];
      for (let i = 0; i < TUBE_SEGS; i++) for (let j = 0; j < TUBE_RADIAL; j++) {
        const a = i * TUBE_RADIAL + j, b = (i + 1) * TUBE_RADIAL + j;
        const c = i * TUBE_RADIAL + ((j + 1) % TUBE_RADIAL), d = (i + 1) * TUBE_RADIAL + ((j + 1) % TUBE_RADIAL);
        idx.push(a, c, b, b, c, d);
      }
      geom.setIndex(idx);
      const uv = geom.attributes.uv; let ui = 0;
      for (let i = 0; i <= TUBE_SEGS; i++) for (let j = 0; j < TUBE_RADIAL; j++) uv.setXY(ui++, j / TUBE_RADIAL, i / TUBE_SEGS);

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: new THREE.Color(hex).convertSRGBToLinear() },
          uPulseColor: { value: new THREE.Color(0xffffff) },
          uPulseT: { value: 0.5 },
          uPulseOn: { value: 1 },
        },
        vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: `
          uniform float uTime; uniform vec3 uColor; uniform vec3 uPulseColor;
          uniform float uPulseT; uniform float uPulseOn;
          varying vec2 vUv;
          void main(){
            float t=vUv.y;
            float flow=0.5+0.5*sin(t*18.0-uTime*2.6);
            float pulse=uPulseOn*exp(-pow((t-uPulseT)*2.0,2.0));
            vec3 col=uColor*(0.24+flow*0.17)+uPulseColor*(pulse*0.90);
            gl_FragColor=vec4(col,1.0);
          }`,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      });

      const mesh = new THREE.Mesh(geom, mat);
      
      const bulge = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glow, color: 0xffffff, transparent: true, opacity: 0.85,
        blending: THREE.NormalBlending, depthWrite: false, toneMapped: false,
      }));
      bulge.scale.setScalar(0.34);
      mesh.add(bulge);

      scene.add(mesh);
      return { mesh, geom, mat, R, tubeR, spin, precess, speed, phase: Math.random() * 6.28318, bulge, ballT: Math.random() };
    }

    const ring1 = makeCableRing(3.0, 0.045, 0xff2fd6, 0.9, 0.5, 0.16);
    const ring2 = makeCableRing(3.6, 0.038, 0x06b6d4, -0.7, -0.4, -0.12);
    const ring3 = makeCableRing(4.15, 0.032, 0x4d6bfe, 0.65, 0.55, 0.11);
    // deterministic phases, so the stills are reproducible and t controls the ring positions
    ring1.phase = 0.0; ring2.phase = 1.7; ring3.phase = 3.4;

    function updateRing(r, t, dt) {
      r.ballT = ((r.ballT + dt * r.speed) % 1 + 1) % 1;
      const ballT = r.ballT;
      r.mat.uniforms.uTime.value = t;
      r.mat.uniforms.uPulseT.value = ballT;
      r.mat.uniforms.uPulseOn.value = 1;

      const pos = r.geom.attributes.position;
      let p = 0;
      for (let i = 0; i <= TUBE_SEGS; i++) {
        const seg = i / TUBE_SEGS;
        const ang = seg * Math.PI * 2;
        const cx = r.R * Math.cos(ang), cy = r.R * Math.sin(ang);
        _tan.set(-Math.sin(ang), Math.cos(ang), 0);
        _nrm.crossVectors(_up, _tan).normalize();
        _bin.crossVectors(_tan, _nrm).normalize();
        let d = seg - ballT; d -= Math.round(d);
        const rr = r.tubeR * (1 + HOSE_SWELL * Math.exp(-d * d * HOSE_TIGHT));
        for (let j = 0; j < TUBE_RADIAL; j++) {
          const a2 = (j / TUBE_RADIAL) * Math.PI * 2;
          const ca = Math.cos(a2) * rr, sa = Math.sin(a2) * rr;
          pos.setXYZ(p++, cx + _nrm.x * ca + _bin.x * sa, cy + _nrm.y * ca + _bin.y * sa, _nrm.z * ca + _bin.z * sa);
        }
      }
      pos.needsUpdate = true;

      const ba = ballT * Math.PI * 2;
      r.bulge.position.set(r.R * Math.cos(ba), r.R * Math.sin(ba), 0);
      const pa = t * r.precess + r.phase;
      _ax.set(Math.sin(pa), Math.cos(pa) * 0.55, Math.cos(pa) * 0.8).normalize();
      r.mesh.setRotationFromAxisAngle(_ax, t * r.spin);
      r.mesh.scale.setScalar(0.8 + 0.2 * easeOut(Math.min(1, t / 1.4)));
    }

    // ---- stars: the bright twinkling field (white, with a few green), as before ----
    const N = 420;
    const starPos = new Float32Array(N * 3);
    const starPhase = new Float32Array(N);
    const starSize = new Float32Array(N);
    const starCol = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const rr = 14 + Math.random() * 40;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      starPos[i * 3] = rr * Math.sin(ph) * Math.cos(th);
      starPos[i * 3 + 1] = rr * Math.sin(ph) * Math.sin(th);
      starPos[i * 3 + 2] = rr * Math.cos(ph);
      starPhase[i] = Math.random();
      starSize[i] = 0.8 + Math.random() * 1.5;
      const g = Math.random() < 0.35;
      starCol[i * 3] = g ? 0.65 : 1.0;
      starCol[i * 3 + 1] = 1.0;
      starCol[i * 3 + 2] = g ? 0.72 : 1.0;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
    starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
    const starMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        attribute float aPhase; attribute float aSize; attribute vec3 color;
        varying float vPhase; varying vec3 vColor;
        void main(){
          vPhase = aPhase; vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (62.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform float uTime; varying float vPhase; varying vec3 vColor;
        void main(){
          float d = length(gl_PointCoord - vec2(0.5));
          float a = smoothstep(0.5, 0.05, d);
          float tw = 0.78 + 0.22 * sin(uTime * 2.4 + vPhase * 6.28318);
          gl_FragColor = vec4(vColor, a * tw);
        }`,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ---- animation ----
    const BPM = 42;
    const BEATS_PER_BAR = 4;                        // 4/4
    const DRAW_SEC = BEATS_PER_BAR * 60 / BPM;      // one bar: ~5.71 seconds

    // ---- master clock: the AUDIO is the clock when music is present ----
    // Drop a file named `theme.mp3` next to this .html and the scene waits for a tap, so the
    // music and the picture start on the same sample. With no file it auto-starts on a timer.
    const MUSIC_URL = 'theme.mp3';
    let audioCtx = null, useAudio = false, startClock = null, started = false;
    function clockNow() { return (useAudio && audioCtx) ? audioCtx.currentTime : performance.now() / 1000; }
    function beginAt(c) { if (!started) { started = true; startClock = c; document.body.classList.add('go'); } }
    fetch(MUSIC_URL).then((r) => (r.ok ? r.arrayBuffer() : null)).then((buf) => {
      if (!buf) { beginAt(performance.now() / 1000); return; }
      const begin = () => {
        if (started || audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.decodeAudioData(buf).then((dec) => {
          const src = audioCtx.createBufferSource();
          src.buffer = dec; src.connect(audioCtx.destination); src.start(0);
          useAudio = true; beginAt(audioCtx.currentTime);
        });
      };
      window.addEventListener('pointerdown', begin);
      window.addEventListener('keydown', begin);
    }).catch(() => {
      // fetch() is blocked on a file:// page (Firefox gives each file a unique origin), and the
      // booted image opens this page as file:///usr/share/morpheos/login.html. Media elements
      // load file:// without CORS, so fall back to a plain <audio> element. The clock is
      // performance.now(), started on the same tap as the music, so they begin together within
      // play()'s start-up latency.
      const el = new Audio(MUSIC_URL);
      const begin = () => {
        if (started) return;
        el.play().catch(() => {});
        beginAt(performance.now() / 1000);
      };
      window.addEventListener('pointerdown', begin);
      window.addEventListener('keydown', begin);
    });

    let lastT = 0;
    let doneFlashT = -1;
    let starRotY = 0;
    const tmp = new THREE.Color();
    function easeOut(k) { return 1 - Math.pow(1 - k, 3); }

    function animate() {
      requestAnimationFrame(animate);
      const t = STILL != null ? parseFloat(STILL) : (started ? Math.max(0, clockNow() - startClock) : 0);
      const dt = Math.min(0.1, t - lastT);
      lastT = t;

      camera.position.x = Math.sin(t * 0.30) * 0.4;
      camera.position.y = 0.5 + Math.sin(t * 0.22) * 0.22;
      camera.lookAt(0, 0, 0);
      stars.rotation.x = Math.sin(t * 0.05) * 0.15;
      const starSpin = Math.min(1, t / DRAW_SEC);
      starRotY += dt * (0.012 + 0.5 * (1 - easeOut(starSpin)));
      stars.rotation.y = starRotY;
      starMat.uniforms.uTime.value = t;

      // geomesh draws itself into completion while turning left, phasing to green
      const p = Math.min(1, t / DRAW_SEC);
      const k = easeOut(p);
      geomeshGeom.setDrawRange(0, Math.floor(totalEdges * k));
      if (p < 1) {
        const edgeP = k * numEdges;
        const e = Math.min(numEdges - 1, Math.floor(edgeP));
        const f = edgeP - e;
        const arr = geomeshGeom.attributes.position.array;
        const a0 = e * 6, a1 = a0 + 3;
        tipCore.position.set(
          arr[a0] + (arr[a1] - arr[a0]) * f,
          arr[a0 + 1] + (arr[a1 + 1] - arr[a0 + 1]) * f,
          arr[a0 + 2] + (arr[a1 + 2] - arr[a0 + 2]) * f);
        tipHalo.position.copy(tipCore.position);
        tipCore.visible = tipHalo.visible = true;
        tipHalo.material.opacity = 0.72 + 0.2 * Math.sin(t * 28);
      } else {
        tipCore.visible = tipHalo.visible = false;
      }
      geomesh.rotation.y = -t * (0.3 + 0.55 * (1 - k));
      geomesh.rotation.x = Math.sin(t * 0.35) * 0.2;
      let i = 0;
      while (i < STOPS.length - 2 && p > STOPS[i + 1].t) i++;
      const seg = STOPS[i + 1].t - STOPS[i].t;
      const f = seg <= 0 ? 0 : Math.min(1, Math.max(0, (p - STOPS[i].t) / seg));
      tmp.copy(stopColors[i]).lerp(stopColors[i + 1], f);
      geomeshMat.color.copy(tmp);

      // completion: a green settle ripple the moment the mesh lands
      if (STILL == null) {
        if (p >= 1 && doneFlashT < 0) doneFlashT = t;
        if (doneFlashT >= 0) {
          const fp = (t - doneFlashT) / 0.7;
          if (fp < 1) {
            settleFlash.visible = true;
            settleFlash.material.opacity = 0.55 * (1 - fp);
            settleFlash.scale.setScalar(0.6 + 2.2 * fp);
            geomesh.scale.setScalar(1 + 0.05 * Math.sin(fp * Math.PI));
          } else {
            settleFlash.visible = false;
            geomesh.scale.setScalar(1);
          }
        }
      }

      // the intro fades away as the music's reverb/delay tail rings out
      if (STILL == null) {
        const fadeP = Math.min(1, Math.max(0, (t - DRAW_SEC - 0.5) / 2.6));
        fadeEl.style.opacity = fadeP.toFixed(3);
      }

      updateRing(ring1, t, dt);
      updateRing(ring2, t, dt);
      updateRing(ring3, t, dt);

      composer.render();
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>
