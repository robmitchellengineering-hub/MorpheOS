# desk-laptop.toml with changes an AI planner might propose:
# a new Wi-Fi network (tier 2) and broader file access for the CRM (tier 3).
[machine]
name = "sam-laptop"
profile = "desk"
arch = "x86_64"

[network]
wifi = ["office", "home", "client-site"]

[[users]]
name = "sam"
admin = true
recovery_key = true

[[storage.replicas]]
name = "usb-backup"
kind = "disk"
target = "SAM-BACKUP"

[[capsules]]
name = "crm"
runtime = "wine"
source = "recipe:acme-crm-2012"
grants = ["files:documents", "files:downloads", "net:outbound"]
