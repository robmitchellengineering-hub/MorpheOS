[package]
name = "flow-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MorpheOS: the Flow shell as a real Wayland compositor (Smithay), headless for CI first"

[dependencies]
flow-shell = { path = "../flow-shell" }

[target.'cfg(target_os = "linux")'.dependencies]
# E10: libinput for the keyboard and mouse, and a libseat session (seatd) that owns the VT
# and hands over the display and input devices. Building needs libinput-dev, libseat-dev
# and libudev-dev.
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "renderer_pixman", "backend_libinput", "backend_session_libseat", "backend_udev"] }
# E3: show the frame on a real display through a DRM dumb buffer (no GPU stack needed).
drm = "0.14.1"
# The test client (src/bin/solid-window.rs): a real Wayland client, no toolkit.
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client"] }
