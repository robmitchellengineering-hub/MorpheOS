[package]
name = "morph-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MorpheOS: the service graph — order a Manifest's services and apply a change to them transactionally"

[dependencies]
morph-manifest = { path = "../morph-manifest" }
morph-transaction = { path = "../morph-transaction" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
