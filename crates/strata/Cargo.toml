[package]
name = "strata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MorpheOS Strata v0: every saved version of every file, rewind, and ransomware detection"

[dependencies]
blake3 = "1.8.7"
fastcdc = "5.0.0"
inotify = "0.11.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zstd = "0.14.1"
