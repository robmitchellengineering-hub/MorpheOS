[package]
name = "flow-wifi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MorpheOS: the Wi-Fi picker on the Flow shell, over NetworkManager's D-Bus API"

[dependencies]
flow-shell = { path = "../flow-shell" }

# The colour list (tests/colours.rs) holds every colour a test reads by, including the
# timeline's and the notice's, so it depends on those crates' colours modules.
[dev-dependencies]
flow-timeline = { path = "../flow-timeline" }
flow-notice = { path = "../flow-notice" }

[target.'cfg(target_os = "linux")'.dependencies]
# The window: a plain Wayland client, as solid-window is, with the compositor's own keymap.
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client"] }
xkbcommon = "0.8.0"
rustix = { version = "1.1.5", features = ["event"] }
# NetworkManager's D-Bus API, on the system bus. Pure Rust: no libdbus to link.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
