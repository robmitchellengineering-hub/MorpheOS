[package]
name = "flow-notice"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MorpheOS: a one-message notice window on the Flow shell (the space guard's warning, a rolled-back change)"

[dependencies]
flow-shell = { path = "../flow-shell" }

[target.'cfg(target_os = "linux")'.dependencies]
# The window: a plain Wayland client, as solid-window is, with the compositor's own keymap.
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client"] }
rustix = { version = "1.1.5", features = ["event"] }
